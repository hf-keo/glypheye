name: Build Gravity Eyes APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Fetch verified official Nothing SDK
        run: python scripts/fetch_sdk.py
      - name: Compile APK, test physics, and lint
        run: bash gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Name APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GravityEyes-debug.apk
          cd dist
          sha256sum GravityEyes-debug.apk > GravityEyes-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GravityEyes-debug-APK
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
